<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>carecore 担当者会議AI議事録</title>
    <link rel="icon" type="image/png" href="./favicon.png"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        carePrimary: "#7a6859",
                        carePrimaryDark: "#635447",
                        carePrimaryLight: "#f5f0eb",
                        careGreen: "#6b8e4e",
                        careBg: "#f4f5f8",
                        careCard: "#ffffff",
                        careBorder: "#e5e7eb",
                        careText: "#1f2937",
                        careMuted: "#6b7280"
                    }, 
                    fontFamily: { sans: ['"Noto Sans JP"', 'sans-serif'] } 
                } 
            } 
        }
    </script>
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f4f5f8; color: #1f2937; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .sidebar-open { transform: translateX(0%); }
        .sidebar-closed { transform: translateX(-100%); }
        .tab-btn-active {
            background-color: #7a6859;
            color: #ffffff;
            font-weight: 700;
        }
    </style>
</head>
<body class="bg-careBg h-[100dvh] overflow-hidden flex flex-col">

    <!-- ── Header ── -->
    <header class="bg-white text-slate-800 px-4 py-2.5 flex justify-between items-center shadow-sm z-30 shrink-0 border-b border-careBorder">
        <div class="flex items-center gap-3">
            <button onclick="toggleSidebar()" class="flex items-center justify-center p-1.5 rounded-lg text-slate-600 hover:bg-slate-100 transition" title="メニューを開く">
                <span class="material-symbols-outlined text-2xl">menu</span>
            </button>
            <div class="flex items-center gap-2">
                <img src="./logo.png" alt="carecore" class="h-7 md:h-8 object-contain" onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='inline-block';">
                <span id="logoFallback" class="font-bold text-xl text-carePrimary hidden" style="font-family:sans-serif;">care<span class="text-careGreen">core</span></span>
                <span class="text-xs md:text-sm font-bold text-slate-500 border-l border-slate-300 pl-2.5 ml-1">担当者会議AI議事録</span>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button onclick="openSettingsModal()" class="flex items-center gap-1 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-full transition border border-slate-200">
                <span class="material-symbols-outlined text-sm">settings</span>設定
            </button>
        </div>
    </header>

    <!-- ── Sidebar Overlay ── -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-slate-900/40 z-40 hidden transition-opacity" onclick="toggleSidebar()"></div>
    
    <!-- ── Sidebar ── -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-80 bg-white flex flex-col transition-transform duration-300 sidebar-closed shadow-2xl shrink-0 border-r border-careBorder">
        <div class="p-4 border-b border-careBorder bg-carePrimaryLight flex items-center justify-between shrink-0">
            <div class="flex items-center gap-2 text-carePrimary">
                <span class="material-symbols-outlined text-xl">folder_open</span>
                <h2 class="font-bold text-sm">過去ログ呼び出し</h2>
            </div>
            <button onclick="toggleSidebar()" class="p-1 rounded-full text-slate-400 hover:bg-white transition" title="閉じる">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        
        <div class="p-3 bg-slate-50 border-b border-careBorder shrink-0 space-y-2">
            <div class="flex justify-between items-center">
                <p class="text-xs font-bold text-slate-500">保存済みデータ</p>
                <button onclick="loadHistory()" class="text-carePrimary hover:bg-slate-200 p-1 rounded-full transition flex items-center" title="最新の情報に更新">
                    <span class="material-symbols-outlined text-sm">refresh</span>
                </button>
            </div>
            <div class="relative">
                <span class="material-symbols-outlined absolute left-2.5 top-2.5 text-slate-400 text-base">search</span>
                <input type="text" id="searchInput" onkeyup="filterHistory()" placeholder="名前や日付で検索..." class="w-full pl-8 p-2 text-xs bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-carePrimary outline-none">
            </div>
        </div>
        
        <div id="historyList" class="flex-1 overflow-y-auto p-3 space-y-2.5">
            <div class="text-center text-slate-400 text-xs mt-5">読み込み中...</div>
        </div>
    </aside>

    <!-- ── Main Workspace ── -->
    <div class="flex-1 flex flex-col md:flex-row overflow-y-auto md:overflow-hidden relative w-full p-2.5 md:p-4 gap-3 md:gap-4">
        
        <!-- 左パネル：入力・生成 -->
        <main class="w-full md:flex-1 md:overflow-y-auto bg-careCard rounded-xl shadow-sm flex flex-col shrink-0 border border-careBorder">
            <div class="p-4 md:p-6 space-y-5 pb-8">
                
                <header class="flex items-center gap-2 border-b border-slate-100 pb-3">
                    <span class="material-symbols-outlined text-carePrimary text-2xl">edit_square</span>
                    <h2 class="text-base md:text-lg font-bold text-slate-800">新規作成</h2>
                </header>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">📅 会議実施日</label>
                        <input type="date" id="meetingDate" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-carePrimary outline-none bg-slate-50">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">👤 利用者氏名</label>
                        <input type="text" id="clientName" placeholder="例: 鈴木 太郎 様" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-carePrimary outline-none bg-slate-50">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-2">🎤 音声データの追加</label>
                    
                    <div class="bg-carePrimaryLight/60 p-3 rounded-lg border border-carePrimary/20 mb-3 text-center">
                        <p class="text-[11px] text-carePrimaryDark leading-relaxed">
                            ※ボイスメモ等で録音した音声ファイルを選択してください。
                        </p>
                    </div>

                    <div class="flex flex-col gap-3">
                        <input type="file" id="audioFile" accept="audio/*, .m4a, .mp3, .wav" class="hidden" onchange="handleFileSelect(this)">
                        <label for="audioFile" class="w-full inline-flex items-center justify-center gap-2 bg-white border-2 border-dashed border-slate-300 text-slate-700 py-3.5 px-4 rounded-xl font-bold shadow-sm cursor-pointer hover:border-carePrimary hover:bg-carePrimaryLight/30 active:scale-[0.99] transition-all text-sm">
                            <span class="material-symbols-outlined text-xl text-carePrimary">upload_file</span>
                            録音ファイルを選択する
                        </label>
                    </div>

                    <div id="fileNameDisplay" class="mt-2 text-xs font-bold text-slate-600 hidden text-center bg-slate-50 border border-slate-200 p-2 rounded-lg">
                        選択中: <span id="fileNameSpan" class="text-carePrimary break-all"></span>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">📝 補足メモ・キーワード</label>
                    <textarea id="inputText" class="w-full h-24 p-3 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-carePrimary resize-none shadow-inner" placeholder="（※音声があれば空欄でOK！会議で特に強調したいポイントがあれば記入してください）"></textarea>
                </div>

                <div class="pt-2">
                    <button id="generateBtn" onclick="generateMinutesFromUI()" class="w-full py-3.5 bg-carePrimary hover:bg-carePrimaryDark text-white rounded-xl font-bold text-sm md:text-base shadow hover:shadow-md active:scale-[0.99] transition-all flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-xl text-amber-300">bolt</span>
                        AIで要約を作成する
                    </button>
                </div>
                
                <div id="loadingMsg" class="hidden text-center py-6 px-4 bg-white border border-slate-200 rounded-xl shadow-inner relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1 bg-slate-200"><div class="h-full bg-carePrimary animate-pulse"></div></div>
                    <div class="flex flex-col items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-3xl animate-spin text-carePrimary">sync</span>
                        <span class="font-bold text-sm text-slate-700">AIが音声・テキストを解析中...</span>
                        <p class="text-xs text-slate-500">画面を閉じずにそのままお待ちください（2-3分かかります）</p>
                    </div>
                </div>
            </div>
        </main>

        <!-- 右パネル：カイポケ貼付データ・プレビュー -->
        <section id="previewSection" class="w-full md:w-[450px] lg:w-[600px] xl:w-[850px] bg-careCard rounded-xl shadow-sm flex flex-col shrink-0 border border-careBorder md:overflow-hidden relative transition-all">
            <div class="p-3.5 border-b border-careBorder flex items-center justify-between shrink-0 sticky top-0 bg-white z-20 rounded-t-xl">
                <div class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-carePrimary">assignment_turned_in</span>
                    <h3 class="font-bold text-slate-800 text-sm md:text-base">カイポケ貼付データ</h3>
                </div>
                <button onclick="clearAll()" class="text-xs bg-slate-100 text-slate-600 hover:bg-slate-200 py-1.5 px-3 rounded-full transition flex items-center gap-1 font-bold">
                    <span class="material-symbols-outlined text-sm">delete</span>クリア
                </button>
            </div>
            
            <div class="flex-1 p-4 bg-white overflow-y-auto space-y-4 pb-8">
                
                <!-- 全体要約 -->
                <div class="p-3 bg-carePrimaryLight/40 border border-carePrimary/20 rounded-lg">
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-xs font-bold text-carePrimaryDark flex items-center gap-1">
                            <span class="material-symbols-outlined text-base text-amber-600">lightbulb</span>全体要約
                        </label>
                        <button onclick="copyToClipboard('outSummary', this)" class="text-xs bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 py-1 px-3 rounded-full shadow-sm flex items-center gap-1 transition-all font-bold">
                            コピー
                        </button>
                    </div>
                    <textarea id="outSummary" class="w-full text-sm bg-transparent border-none resize-y focus:ring-0 text-slate-800 p-0" rows="3" placeholder="AIの回答がここに入ります"></textarea>
                </div>

                <div class="space-y-4">
                    <div class="border-b border-slate-100 pb-3">
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-xs font-bold text-slate-700">① 検討した項目</label>
                            <button onclick="copyToClipboard('outItem1', this)" class="text-xs bg-white border border-slate-300 hover:bg-slate-100 py-1 px-3 rounded-full shadow-sm flex items-center gap-1 transition-all font-bold">コピー</button>
                        </div>
                        <textarea id="outItem1" class="w-full p-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-carePrimary resize-y" rows="3"></textarea>
                    </div>
                    
                    <div class="border-b border-slate-100 pb-3">
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-xs font-bold text-slate-700">② 検討内容</label>
                            <button onclick="copyToClipboard('outItem2', this)" class="text-xs bg-white border border-slate-300 hover:bg-slate-100 py-1 px-3 rounded-full shadow-sm flex items-center gap-1 transition-all font-bold">コピー</button>
                        </div>
                        <textarea id="outItem2" class="w-full p-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-carePrimary resize-y" rows="5"></textarea>
                    </div>

                    <div class="border-b border-slate-100 pb-3">
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-xs font-bold text-slate-700">③ 結論</label>
                            <button onclick="copyToClipboard('outItem3', this)" class="text-xs bg-white border border-slate-300 hover:bg-slate-100 py-1 px-3 rounded-full shadow-sm flex items-center gap-1 transition-all font-bold">コピー</button>
                        </div>
                        <textarea id="outItem3" class="w-full p-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-carePrimary resize-y" rows="4"></textarea>
                    </div>

                    <div class="pb-2">
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-xs font-bold text-slate-700">④ 残された課題</label>
                            <button onclick="copyToClipboard('outItem4', this)" class="text-xs bg-white border border-slate-300 hover:bg-slate-100 py-1 px-3 rounded-full shadow-sm flex items-center gap-1 transition-all font-bold">コピー</button>
                        </div>
                        <textarea id="outItem4" class="w-full p-2.5 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-carePrimary resize-y" rows="4"></textarea>
                    </div>
                </div>
            </div>

            <div class="p-3.5 bg-slate-50 border-t border-careBorder shrink-0 sticky bottom-0 z-20 rounded-b-xl">
                <button onclick="saveLogFromUI()" class="w-full py-3 bg-carePrimary hover:bg-carePrimaryDark text-white rounded-xl font-bold text-sm flex items-center justify-center gap-2 hover:opacity-95 active:scale-[0.99] transition-all shadow">
                    <span class="material-symbols-outlined">cloud_upload</span>
                    データベースに保存
                </button>
            </div>
        </section>
    </div>

    <!-- ── 設定モーダル ── -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-900/40 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl border border-careBorder">
            <h3 class="font-bold text-base text-slate-800 mb-1">⚙️ GAS API エンドポイント設定</h3>
            <p class="text-xs text-slate-500 mb-4">デプロイした GAS の「ウェブアプリURL」を設定します。</p>
            <input type="text" id="gasApiUrlInput" class="w-full p-2.5 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-carePrimary outline-none mb-4" placeholder="https://script.google.com/macros/s/.../exec">
            <div class="flex justify-end gap-2">
                <button onclick="closeSettingsModal()" class="px-4 py-2 text-xs font-bold text-slate-600 hover:bg-slate-100 rounded-lg">キャンセル</button>
                <button onclick="saveSettings()" class="px-4 py-2 text-xs font-bold bg-carePrimary text-white rounded-lg hover:bg-carePrimaryDark">保存する</button>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_GAS_API_URL = 'https://script.google.com/macros/s/AKfycbyFBqBdzxxj_Yb6pblY_aS8UQspLdb59pCnrDS0XZy7G_MX3foCp8M7CWzPBzob_rPa/exec';
        let GAS_API_URL = localStorage.getItem('COOPS_GAS_API_URL') || DEFAULT_GAS_API_URL;
        let selectedAudioFile = null;

        async function callApi(action, payload = {}) {
            if (!GAS_API_URL) {
                openSettingsModal();
                throw new Error('GAS API URLが設定されていません。');
            }
            try {
                const res = await fetch(GAS_API_URL, {
                    method: 'POST',
                    mode: 'cors',
                    redirect: 'follow',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action, payload })
                });
                if (!res.ok) {
                    throw new Error(`HTTPエラー ${res.status}`);
                }
                const data = await res.json();
                if (data && data.error) throw new Error(data.error);
                return data;
            } catch(err) {
                console.error("API Call Error:", err);
                if (err.message.includes('Failed to fetch')) {
                    throw new Error('GASへの通信に失敗しました。GASのデプロイ設定で「アクセスできるユーザー」が「全員」になっているかご確認ください。');
                }
                throw err;
            }
        }

        window.onload = function() {
            document.getElementById('meetingDate').valueAsDate = new Date();
            document.getElementById('gasApiUrlInput').value = GAS_API_URL;
            loadHistory();
        };

        function openSettingsModal() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function closeSettingsModal() { document.getElementById('settingsModal').classList.add('hidden'); }
        function saveSettings() {
            const url = document.getElementById('gasApiUrlInput').value.trim();
            if(!url) return;
            GAS_API_URL = url;
            localStorage.setItem('COOPS_GAS_API_URL', url);
            closeSettingsModal();
            loadHistory();
        }

        function handleFileSelect(inputElement) {
            if (inputElement.files && inputElement.files[0]) {
                selectedAudioFile = inputElement.files[0];
                document.getElementById('fileNameDisplay').classList.remove('hidden');
                document.getElementById('fileNameSpan').textContent = selectedAudioFile.name;
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar.classList.contains('sidebar-closed')) {
                sidebar.classList.remove('sidebar-closed');
                sidebar.classList.add('sidebar-open');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.remove('sidebar-open');
                sidebar.classList.add('sidebar-closed');
                overlay.classList.add('hidden');
            }
        }

        function filterHistory() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const items = document.querySelectorAll('.history-item');
            
            items.forEach(function(item) {
                const text = item.innerText.toLowerCase();
                if (text.includes(query)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        async function copyToClipboard(elementId, btnElement) {
            const text = document.getElementById(elementId).value;
            if (!text) { alert("コピーするテキストがありません。"); return; }
            try {
                await navigator.clipboard.writeText(text);
                const originalHtml = btnElement.innerHTML;
                btnElement.innerHTML = '<span class="material-symbols-outlined text-[14px]">check</span>完了';
                btnElement.className = 'text-xs bg-slate-100 border border-slate-400 text-slate-800 py-1 px-3 rounded-full shadow-sm flex items-center gap-1 transition-all font-bold';
                setTimeout(() => {
                    btnElement.innerHTML = originalHtml;
                    btnElement.className = 'text-xs bg-white border border-slate-300 hover:bg-slate-100 py-1 px-3 rounded-full shadow-sm flex items-center gap-1 transition-all font-bold';
                }, 2000);
            } catch (err) {
                alert("コピーに失敗しました。手動でコピーしてください。");
            }
        }

        async function generateMinutesFromUI() {
            const inputText = document.getElementById('inputText').value;
            
            if (!inputText && !selectedAudioFile) {
                alert("メモを入力するか、音声データを添付してください。");
                return;
            }

            const btn = document.getElementById('generateBtn');
            const loading = document.getElementById('loadingMsg');
            btn.style.display = 'none';
            loading.classList.remove('hidden');

            const resetUI = function() {
                btn.style.display = 'flex';
                loading.classList.add('hidden');
            };

            try {
                let audioData = null;
                if (selectedAudioFile) {
                    if (selectedAudioFile.size > 40 * 1024 * 1024) {
                        alert("音声ファイルのサイズが40MBを超えています。");
                        resetUI();
                        return;
                    }
                    audioData = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = e => resolve({
                            mimeType: selectedAudioFile.type || 'audio/mp3',
                            base64: e.target.result.split(',')[1]
                        });
                        reader.onerror = reject;
                        reader.readAsDataURL(selectedAudioFile);
                    });
                }

                const result = await callApi('generateMinutes', { inputText, audioData });
                
                document.getElementById('outSummary').value = result.summary || '';
                document.getElementById('outItem1').value = result.item1 || '';
                document.getElementById('outItem2').value = result.item2 || '';
                document.getElementById('outItem3').value = result.item3 || '';
                document.getElementById('outItem4').value = result.item4 || '';

                resetUI();
                if(window.innerWidth < 768) {
                    document.getElementById('previewSection').scrollIntoView({ behavior: 'smooth' });
                }
            } catch(err) {
                alert(err.message);
                resetUI();
            }
        }

        async function saveLogFromUI() {
            const meetingDate = document.getElementById('meetingDate').value;
            const clientName = document.getElementById('clientName').value;
            const inputText = document.getElementById('inputText').value;
            const summary = document.getElementById('outSummary').value;
            const out1 = document.getElementById('outItem1').value;
            const out2 = document.getElementById('outItem2').value;
            const out3 = document.getElementById('outItem3').value;
            const out4 = document.getElementById('outItem4').value;
            
            if (!out1 && !out2) {
                alert("まだ議事録が作成されていません。");
                return;
            }

            const saveBtn = document.querySelector('button[onclick="saveLogFromUI()"]');
            const origHtml = saveBtn.innerHTML;
            saveBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span>保存中...';
            saveBtn.disabled = true;

            try {
                const res = await callApi('saveLogAndFinish', {
                    meetingDate, clientName, inputText, summary,
                    item1: out1, item2: out2, item3: out3, item4: out4
                });
                alert("✅ " + (res.message || "保存完了しました"));
                saveBtn.innerHTML = origHtml;
                saveBtn.disabled = false;
                loadHistory(); 
            } catch(err) {
                alert(err.message);
                saveBtn.innerHTML = origHtml;
                saveBtn.disabled = false;
            }
        }

        async function loadHistory() {
            const listDiv = document.getElementById('historyList');
            listDiv.innerHTML = '<div class="text-center text-slate-400 text-xs mt-5">読み込み中...</div>';
            
            try {
                const historyArr = await callApi('getHistorySummaryList');
                listDiv.innerHTML = '';
                if (!historyArr || historyArr.length === 0) {
                    listDiv.innerHTML = '<div class="text-center text-slate-400 text-xs mt-5">履歴がありません</div>';
                    return;
                }
                
                historyArr.forEach(function(item) {
                    const html = `
                    <div onclick="restoreHistory(${item.id})" class="history-item bg-white border border-careBorder p-3 rounded-lg shadow-sm cursor-pointer hover:border-carePrimary hover:bg-carePrimaryLight/30 transition">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[11px] font-bold text-slate-500">${item.meetingDate}</span>
                            <span class="text-[10px] text-slate-400">#${item.id}</span>
                        </div>
                        <div class="font-bold text-slate-800 text-xs truncate">${item.clientName}</div>
                    </div>`;
                    listDiv.innerHTML += html;
                });
                
                filterHistory();
            } catch (err) {
                listDiv.innerHTML = '<div class="text-center text-rose-500 font-bold text-xs mt-5 p-3 bg-rose-50 rounded-lg">⚠️ 読込エラー<br>' + err.message + '</div>';
            }
        }

        async function restoreHistory(rowId) {
            try {
                const item = await callApi('getLogDetail', { id: rowId });
                
                if(item.meetingDate) document.getElementById('meetingDate').value = item.meetingDate.replace(/\//g, '-');
                document.getElementById('clientName').value = item.clientName !== "名前なし" ? item.clientName : '';
                document.getElementById('inputText').value = item.inputText || '';
                document.getElementById('outSummary').value = item.summary || '';
                document.getElementById('outItem1').value = item.item1 || '';
                document.getElementById('outItem2').value = item.item2 || '';
                document.getElementById('outItem3').value = item.item3 || '';
                document.getElementById('outItem4').value = item.item4 || '';
                
                toggleSidebar();
                
                if(window.innerWidth < 768) {
                    document.getElementById('previewSection').scrollIntoView({ behavior: 'smooth' });
                }
            } catch (err) {
                alert("詳細データの読み込みに失敗しました: " + err.message);
            }
        }

        function clearAll() {
            if(!confirm("画面の入力内容をすべてクリアしますか？（※保存済みのデータは消えません）")) return;
            document.getElementById('meetingDate').valueAsDate = new Date();
            document.getElementById('clientName').value = '';
            document.getElementById('inputText').value = '';
            document.getElementById('audioFile').value = '';
            
            selectedAudioFile = null;
            document.getElementById('fileNameDisplay').classList.add('hidden');
            
            document.getElementById('outSummary').value = '';
            document.getElementById('outItem1').value = '';
            document.getElementById('outItem2').value = '';
            document.getElementById('outItem3').value = '';
            document.getElementById('outItem4').value = '';
        }
    </script>
</body>
</html>
