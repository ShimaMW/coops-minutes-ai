<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COOPs 担当者会議議事録AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #374151;
      --card: #ffffff;
      --card-sub: #f8fafc;
      --clover: #354045;
      --clover-h: #2a3338;
      --clover-dim: rgba(53, 64, 69, 0.08);
      --clover-mid: rgba(53, 64, 69, 0.18);
      --border: #e2e8f0;
      --border-mid: #cbd5e1;
      --text: #1e293b;
      --text-muted: #64748b;
      --danger: #ef4444;
      --success: #10b981;
      --amber: #f59e0b;
      --blue: #3b82f6;
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.18);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.22);
      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 20px;
      --t: 0.18s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
    }

    .msym {
      font-family: 'Material Symbols Outlined';
      font-size: 20px;
      line-height: 1;
      display: inline-block;
      vertical-align: middle;
    }

    /* ─── Loading ─── */
    #loadingOverlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(55, 65, 81, 0.92);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.3s;
    }
    #loadingOverlay.hidden { opacity: 0; pointer-events: none; }
    .loader-ring {
      width: 52px; height: 52px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text { color: rgba(255, 255, 255, 0.8); font-size: 0.88rem; }

    /* ─── Toast ─── */
    #toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--card); border-radius: var(--r-md);
      padding: 11px 24px; font-size: 0.85rem; font-weight: 600;
      box-shadow: var(--shadow-lg); z-index: 8000;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
    #toast.success { color: var(--success); border-left: 4px solid var(--success); }
    #toast.error { color: var(--danger); border-left: 4px solid var(--danger); }

    /* ─── App Shell ─── */
    .app-shell {
      width: 100%; max-width: 860px;
      margin: 0 auto; padding: 20px 14px 60px;
    }

    .app-header {
      background: var(--clover); color: #fff;
      padding: 14px 20px; border-radius: var(--r-lg);
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; box-shadow: var(--shadow-md);
    }
    .app-header h1 { font-size: 1.05rem; font-weight: 700; }
    .app-header p { font-size: 0.72rem; color: rgba(255, 255, 255, 0.65); }

    .tabs { display: flex; gap: 4px; }
    .tab-btn {
      flex: 1; padding: 11px 8px; border: none;
      background: rgba(255, 255, 255, 0.12); color: rgba(255, 255, 255, 0.65);
      font-family: inherit; font-size: 0.85rem; font-weight: 500;
      cursor: pointer; border-radius: var(--r-sm) var(--r-sm) 0 0;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all var(--t);
    }
    .tab-btn.active { background: var(--card); color: var(--clover); font-weight: 700; }

    .tab-content {
      display: none; background: var(--card);
      border-radius: 0 0 var(--r-lg) var(--r-lg);
      padding: 24px 22px; box-shadow: var(--shadow-lg);
    }
    .tab-content.active { display: block; }

    .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
    .form-label { font-size: 0.78rem; color: var(--text-muted); font-weight: 500; }
    .form-row { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; margin-bottom: 14px; }

    input[type=text], input[type=date], textarea {
      width: 100%; background: var(--card-sub);
      border: 1px solid var(--border); border-radius: var(--r-sm);
      color: var(--text); font-family: inherit; font-size: 0.95rem;
      padding: 10px 12px; outline: none; transition: border var(--t);
    }
    input[type=text]:focus, input[type=date]:focus, textarea:focus {
      border-color: var(--clover);
    }
    textarea { resize: vertical; min-height: 100px; line-height: 1.6; }

    .audio-card {
      border: 2px dashed var(--border-mid); border-radius: var(--r-md);
      padding: 18px 14px; text-align: center; cursor: pointer;
      background: var(--card-sub); transition: all var(--t);
      margin-bottom: 14px;
    }
    .audio-card:hover { border-color: var(--clover); background: var(--clover-dim); }
    .audio-card.active-audio { border-color: var(--clover); border-style: solid; background: var(--clover-dim); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 10px 20px; border-radius: var(--r-sm); border: none;
      cursor: pointer; font-family: inherit; font-size: 0.85rem; font-weight: 700;
      transition: all var(--t);
    }
    .btn-primary { background: var(--clover); color: #fff; }
    .btn-primary:hover { background: var(--clover-h); }
    .btn-secondary { background: var(--card-sub); color: var(--text); border: 1px solid var(--border); }
    .btn-amber { background: rgba(245, 158, 11, 0.1); color: var(--amber); border: 1px solid rgba(245, 158, 11, 0.3); }

    .section-card {
      background: var(--card-sub); border: 1px solid var(--border);
      border-left: 4px solid var(--clover); border-radius: var(--r-md);
      padding: 14px 16px; margin-bottom: 12px;
    }
    .section-title { font-size: 0.9rem; font-weight: 700; color: var(--clover); margin-bottom: 6px; }

    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th { background: var(--clover); color: #fff; padding: 10px 12px; text-align: left; }
    td { padding: 9px 12px; border-bottom: 1px solid var(--border); }
    tr:hover td { background: var(--clover-dim); }

    .tbl-btn {
      padding: 4px 10px; border-radius: 6px; font-size: 0.72rem;
      font-weight: 600; border: 1px solid var(--clover); background: #fff;
      color: var(--clover); cursor: pointer;
    }
    .tbl-btn:hover { background: var(--clover-dim); }

    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 7000;
      background: rgba(45, 55, 72, 0.72); backdrop-filter: blur(4px);
      align-items: flex-start; justify-content: center; padding: 20px; overflow-y: auto;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--card); border-radius: var(--r-lg);
      width: 100%; max-width: 760px; margin: auto; padding: 24px;
      box-shadow: var(--shadow-lg);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
    .modal-title { font-size: 1rem; font-weight: 700; color: var(--clover); }
    .modal-close { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--text-muted); }

    .action-row { display: flex; gap: 8px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }
    .hidden { display: none !important; }

    @media (max-width: 480px) {
      .form-row { grid-template-columns: 1fr; }
      .btn { width: 100%; }
    }
  </style>
</head>

<body>

  <div id="loadingOverlay">
    <div class="loader-ring"></div>
    <div class="loader-text" id="loadingText">データを読み込んでいます...</div>
  </div>

  <div id="toast"></div>

  <div class="app-shell">

    <header class="app-header">
      <div>
        <h1>COOPs 担当者会議議事録AI</h1>
        <p>サービス担当者会議 議事録自動作成アシスタント</p>
      </div>
      <button class="btn btn-secondary" style="font-size:0.75rem; padding:4px 10px;" onclick="openModal('settingsModal')">
        <span class="msym" style="font-size:16px;">settings</span>設定
      </button>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" onclick="switchTab('create')" id="tab-btn-create">
        <span class="msym" style="font-size:17px;">edit_note</span>議事録作成
      </button>
      <button class="tab-btn" onclick="switchTab('history')" id="tab-btn-history">
        <span class="msym" style="font-size:17px;">table_view</span>過去ログ一覧
      </button>
    </nav>

    <!-- ══ TAB: 作成 ══ -->
    <div id="tab-create" class="tab-content active">

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">📅 会議開催日</label>
          <input type="date" id="meetingDate">
        </div>
        <div class="form-group">
          <label class="form-label">👤 対象利用者名</label>
          <input type="text" id="clientName" placeholder="例：山田 太郎 様">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">📝 メモ・テキスト起こしデータ</label>
        <textarea id="inputText" placeholder="会議中のメモや発言内容、議題のテキストを入力してください。"></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">🎙️ 録音音声ファイル（任意）</label>
        <div class="audio-card" id="uploadCard" onclick="document.getElementById('fileInput').click()">
          <div style="font-size:1.8rem; margin-bottom:4px;">🗂️</div>
          <div style="font-size:0.85rem; font-weight:600;">音声ファイルを選択 (.mp3, .m4a, .wav等)</div>
          <div id="uploadStatus" style="font-size:0.75rem; color:var(--success); margin-top:4px;" class="hidden"></div>
          <input type="file" id="fileInput" accept="audio/*" onchange="handleUploadFile(event)" style="display:none;">
        </div>
      </div>

      <div style="text-align:center; margin-top:18px;">
        <button class="btn btn-primary" onclick="runGenerateMinutes()" style="min-width:220px;">
          <span class="msym" style="font-size:18px;">auto_awesome</span>AI議事録を生成する
        </button>
      </div>

      <!-- 結果表示 -->
      <div id="resultArea" class="hidden" style="margin-top:24px; border-top:1px solid var(--border); padding-top:20px;">
        <h3 style="font-size:1rem; font-weight:700; color:var(--clover); margin-bottom:14px; display:flex; align-items:center; gap:6px;">
          <span class="msym">check_circle</span>生成結果
        </h3>

        <div class="section-card">
          <div class="section-title">📌 1. 会議要約（全体まとめ）</div>
          <textarea class="editable-result" id="res_summary" rows="4"></textarea>
        </div>

        <div class="section-card">
          <div class="section-title">🎯 2. 開催目的・検討議題 (item1)</div>
          <textarea class="editable-result" id="res_item1" rows="4"></textarea>
        </div>

        <div class="section-card">
          <div class="section-title">💡 3. 発言内容・主な議論 (item2)</div>
          <textarea class="editable-result" id="res_item2" rows="6"></textarea>
        </div>

        <div class="section-card">
          <div class="section-title">✨ 4. 合意・決定事項・理由 (item3)</div>
          <textarea class="editable-result" id="res_item3" rows="5"></textarea>
        </div>

        <div class="section-card">
          <div class="section-title">🎉 5. 今後の課題・次回予定 (item4)</div>
          <textarea class="editable-result" id="res_item4" rows="4"></textarea>
        </div>

        <div class="action-row">
          <button class="btn btn-primary" onclick="runSaveLog()">
            <span class="msym" style="font-size:16px;">cloud_upload</span>データベースに保存
          </button>
          <button class="btn btn-secondary" onclick="copyFullMinutes()">
            <span class="msym" style="font-size:16px;">content_copy</span>テキストコピー
          </button>
          <button class="btn btn-amber" onclick="window.print()">
            <span class="msym" style="font-size:16px;">print</span>印刷
          </button>
        </div>
      </div>

    </div>

    <!-- ══ TAB: 履歴 ══ -->
    <div id="tab-history" class="tab-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h3 style="font-size:0.95rem; font-weight:700;">過去の議事録ログ一覧</h3>
        <button class="btn btn-secondary" style="font-size:0.75rem; padding:4px 10px;" onclick="loadHistory()">
          <span class="msym" style="font-size:15px;">refresh</span>更新
        </button>
      </div>

      <div style="overflow-x:auto; border:1px solid var(--border); border-radius:var(--r-md);">
        <table>
          <thead>
            <tr>
              <th>登録日時</th>
              <th>会議日</th>
              <th>利用者名</th>
              <th style="text-align:center;">詳細</th>
            </tr>
          </thead>
          <tbody id="historyTbody">
            <tr><td colspan="4" style="text-align:center; padding:30px; color:var(--text-muted);">読み込み中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- ── 詳細モーダル ── -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-box">
      <div class="modal-header">
        <div>
          <div class="modal-title" id="detailModalTitle">議事録詳細</div>
          <div style="font-size:0.75rem; color:var(--text-muted); margin-top:2px;" id="detailModalSub"></div>
        </div>
        <button class="modal-close" onclick="closeModal('detailModal')">✕</button>
      </div>
      <div id="detailModalBody"></div>
      <div class="action-row" style="margin-top:16px;">
        <button class="btn btn-amber" onclick="window.print()">
          <span class="msym" style="font-size:15px;">print</span>印刷
        </button>
        <button class="btn btn-secondary" onclick="closeModal('detailModal')">閉じる</button>
      </div>
    </div>
  </div>

  <!-- ── 設定モーダル ── -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-box" style="max-width: 520px;">
      <div class="modal-header">
        <div class="modal-title">⚙️ GAS API 設定</div>
        <button class="modal-close" onclick="closeModal('settingsModal')">✕</button>
      </div>
      <div class="form-group">
        <label class="form-label">GAS Web App URL</label>
        <input type="text" id="gasApiUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
      </div>
      <div class="action-row">
        <button class="btn btn-primary" onclick="saveSettings()">設定を保存</button>
        <button class="btn btn-secondary" onclick="closeModal('settingsModal')">閉じる</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_GAS_API_URL = 'https://script.google.com/macros/s/AKfycbyFBqBdzxxj_Yb6pblY_aS8UQspLdb59pCnrDS0XZy7G_MX3foCp8M7CWzPBzob_rPa/exec';
    let GAS_API_URL = localStorage.getItem('COOPS_GAS_API_URL') || DEFAULT_GAS_API_URL;
    let currentAudio = null;
    let currentResult = null;

    async function callApi(action, payload = {}) {
      if (!GAS_API_URL) {
        openModal('settingsModal');
        throw new Error('GAS API URLが設定されていません。');
      }
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, payload })
      });
      const data = await res.json();
      if (data && data.error) throw new Error(data.error);
      return data;
    }

    function saveSettings() {
      const url = document.getElementById('gasApiUrlInput').value.trim();
      if (!url) return;
      GAS_API_URL = url;
      localStorage.setItem('COOPS_GAS_API_URL', url);
      showToast('設定を保存しました');
      closeModal('settingsModal');
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('meetingDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('gasApiUrlInput').value = GAS_API_URL;
    });

    function showLoading(t) {
      const ov = document.getElementById('loadingOverlay');
      ov.style.display = ''; ov.classList.remove('hidden');
      document.getElementById('loadingText').textContent = t || '処理中...';
    }
    function hideLoading() {
      const ov = document.getElementById('loadingOverlay');
      ov.classList.add('hidden');
      setTimeout(() => ov.style.display = 'none', 350);
    }
    function showToast(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'show ' + (type || 'success');
      setTimeout(() => t.className = '', 3500);
    }

    function switchTab(name) {
      ['create', 'history'].forEach(n => {
        document.getElementById('tab-' + n).classList.remove('active');
        document.getElementById('tab-btn-' + n).classList.remove('active');
      });
      document.getElementById('tab-' + name).classList.add('active');
      document.getElementById('tab-btn-' + name).classList.add('active');
      if (name === 'history') loadHistory();
    }

    function handleUploadFile(e) {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        currentAudio = { base64: ev.target.result.split(',')[1], mimeType: file.type || 'audio/mp3' };
        document.getElementById('uploadCard').classList.add('active-audio');
        const stat = document.getElementById('uploadStatus');
        stat.classList.remove('hidden');
        stat.textContent = `✓ ${file.name} (${(file.size / 1024 / 1024).toFixed(1)}MB)`;
      };
      reader.readAsDataURL(file);
    }

    async function runGenerateMinutes() {
      const inputText = document.getElementById('inputText').value.trim();
      if (!inputText && !currentAudio) {
        showToast('テキストメモか音声ファイルをセットしてください', 'error');
        return;
      }
      showLoading('AIが議事録を生成しています...');
      try {
        const res = await callApi('generateMinutes', { inputText, audioData: currentAudio });
        hideLoading();
        currentResult = res;
        document.getElementById('res_summary').value = res.summary || '';
        document.getElementById('res_item1').value = res.item1 || '';
        document.getElementById('res_item2').value = res.item2 || '';
        document.getElementById('res_item3').value = res.item3 || '';
        document.getElementById('res_item4').value = res.item4 || '';
        document.getElementById('resultArea').classList.remove('hidden');
        showToast('議事録を生成しました ✓');
      } catch (err) {
        hideLoading();
        showToast('生成エラー: ' + err.message, 'error');
      }
    }

    async function runSaveLog() {
      if (!currentResult) return;
      showLoading('データベースに保存しています...');
      try {
        const payload = {
          meetingDate: document.getElementById('meetingDate').value,
          clientName: document.getElementById('clientName').value,
          inputText: document.getElementById('inputText').value,
          summary: document.getElementById('res_summary').value,
          item1: document.getElementById('res_item1').value,
          item2: document.getElementById('res_item2').value,
          item3: document.getElementById('res_item3').value,
          item4: document.getElementById('res_item4').value
        };
        const res = await callApi('saveLogAndFinish', payload);
        hideLoading();
        showToast(res.message || '保存しました ✓');
      } catch (err) {
        hideLoading();
        showToast('保存エラー: ' + err.message, 'error');
      }
    }

    function copyFullMinutes() {
      const txt = [
        `【サービス担当者会議 議事録】`,
        `会議日：${document.getElementById('meetingDate').value}`,
        `利用者名：${document.getElementById('clientName').value || '未記載'}`, '',
        `■ 1. 全体要約\n${document.getElementById('res_summary').value}`, '',
        `■ 2. 開催目的・検討議題\n${document.getElementById('res_item1').value}`, '',
        `■ 3. 発言内容・主な議論\n${document.getElementById('res_item2').value}`, '',
        `■ 4. 合意・決定事項\n${document.getElementById('res_item3').value}`, '',
        `■ 5. 今後の課題・次回予定\n${document.getElementById('res_item4').value}`
      ].join('\n');
      navigator.clipboard.writeText(txt).then(() => showToast('コピーしました')).catch(() => showToast('コピー失敗', 'error'));
    }

    async function loadHistory() {
      const tbody = document.getElementById('historyTbody');
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:30px; color:var(--text-muted);">読み込み中...</td></tr>`;
      try {
        const items = await callApi('getHistorySummaryList');
        if (!items || !items.length) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:30px; color:var(--text-muted);">📭 履歴がありません</td></tr>`;
          return;
        }
        tbody.innerHTML = items.map(item => `
          <tr>
            <td>${esc(item.timestamp)}</td>
            <td>${esc(item.meetingDate)}</td>
            <td>${esc(item.clientName)}</td>
            <td style="text-align:center;">
              <button class="tbl-btn" onclick="openDetailModal(${item.id})">詳細</button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4" style="color:var(--danger); text-align:center; padding:20px;">エラー: ${esc(err.message)}</td></tr>`;
      }
    }

    async function openDetailModal(id) {
      showLoading('詳細を読み込んでいます...');
      try {
        const detail = await callApi('getLogDetail', { id });
        hideLoading();
        document.getElementById('detailModalTitle').textContent = `議事録詳細｜${esc(detail.clientName)}`;
        document.getElementById('detailModalSub').textContent = `登録日時：${detail.timestamp} / 会議日：${detail.meetingDate}`;
        document.getElementById('detailModalBody').innerHTML = `
          <div class="section-card"><div class="section-title">📌 1. 会議要約</div><div style="white-space:pre-wrap; line-height:1.7;">${esc(detail.summary)}</div></div>
          <div class="section-card"><div class="section-title">🎯 2. 開催目的・検討議題</div><div style="white-space:pre-wrap; line-height:1.7;">${esc(detail.item1)}</div></div>
          <div class="section-card"><div class="section-title">💡 3. 発言内容・主な議論</div><div style="white-space:pre-wrap; line-height:1.7;">${esc(detail.item2)}</div></div>
          <div class="section-card"><div class="section-title">✨ 4. 合意・決定事項・理由</div><div style="white-space:pre-wrap; line-height:1.7;">${esc(detail.item3)}</div></div>
          <div class="section-card"><div class="section-title">🎉 5. 今後の課題・次回予定</div><div style="white-space:pre-wrap; line-height:1.7;">${esc(detail.item4)}</div></div>
        `;
        openModal('detailModal');
      } catch (err) {
        hideLoading();
        showToast('読み込みエラー: ' + err.message, 'error');
      }
    }

    function openModal(id) { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }
    function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  </script>
</body>

</html>
